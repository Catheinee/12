name: Tongpin Campus iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.swift"
      - "**/*.pbxproj"
      - "**/*.xcscheme"
      - ".github/workflows/ios-build.yml"

jobs:
  simulator-build:
    name: Build iOS Simulator App
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build without signing
        run: >-
          xcodebuild
          -project TongpinCampusIOS.xcodeproj
          -scheme TongpinCampusIOS
          -sdk iphonesimulator
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: TongpinCampusIOS-simulator
          path: build/Build/Products/Debug-iphonesimulator/TongpinCampusIOS.app

  device-ipa-build:
    name: Build unsigned iOS device IPA
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS device without signing
        run: >-
          xcodebuild
          -project TongpinCampusIOS.xcodeproj
          -scheme TongpinCampusIOS
          -sdk iphoneos
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build-device
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build-device/Build/Products/Release-iphoneos/TongpinCampusIOS.app Payload/TongpinCampusIOS.app
          /usr/bin/zip -qry TongpinCampusIOS-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload device IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TongpinCampusIOS-device-ipa
          path: TongpinCampusIOS-unsigned.ipa
          retention-days: 14

